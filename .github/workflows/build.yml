name: Build Zephyr

on:
  push:
  pull_request:
  workflow_dispatch:      # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write      # necessaire pour publier la Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 (Zephyr + Zephyr FX)
        uses: actions/upload-artifact@v4
        with:
          name: Zephyr-VST3-Windows
          path: |
            build/ZephyrFx_artefacts/Release/VST3/
            build/Zephyr_artefacts/Release/VST3/

      - name: Upload Standalone (pour tester sans Ableton)
        uses: actions/upload-artifact@v4
        with:
          name: Zephyr-Standalone-Windows
          path: |
            build/ZephyrFx_artefacts/Release/Standalone/
            build/Zephyr_artefacts/Release/Standalone/

      - name: Zip VST3 pour la Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path build/ZephyrFx_artefacts/Release/VST3/*, build/Zephyr_artefacts/Release/VST3/* -DestinationPath release/Zephyr-VST3-Windows.zip -Force

      - name: Publier la Release "latest" (lien de telechargement direct)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest release/Zephyr-VST3-Windows.zip --title "Derniere version (build ${{ github.run_number }})" --notes "Build automatique du commit ${{ github.sha }}. Dezipper et copier le dossier .vst3 dans C:\Program Files\Common Files\VST3"
